<!DOCTYPE html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title> GreenDash Charts </title>
        <link href="main.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>
        <main class="container-fluid">
            <header class="dashboard-header">
                <h1>GreenDash</h1>
                <p>by Chelsea Dimaunahan</p>
            </header>

            <div class="row g-4">
                <!-- BAR -->
                <div class="col-12 col-lg-4">
                    <div class="chart-container" id="vendor-order-status">
                        <canvas id="vendor-01" width="400" height="400"></canvas>
                    </div>
                </div>

                <!-- LINE-->
                <div class="col-12 col-lg-4">
                    <div class="chart-container" id="vendor-orders-over-time">
                        <canvas id="vendor-02" width="400" height="400"></canvas>
                    </div>
                </div>

                <!-- LINE -->
                <div class="col-12 col-lg-4">
                    <div class="chart-container" id="user-avg-money-spent">
                        <canvas id="user-01" width="400" height="400"></canvas>
                    </div>
                </div>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="main.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
